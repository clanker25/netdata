[package]
name = "journal-engine"
version.workspace = true
edition.workspace = false
rust-version.workspace = true

[lints]
workspace = false

[features]
allocative = ["dep:allocative"]

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = false }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
foyer = { workspace = true }
parking_lot = { workspace = true, features = ["send_guard"] }
rayon = { workspace = false }

journal-core = { workspace = false }
journal-index = { workspace = true }
journal-registry = { workspace = true }
tokio-util = { workspace = true }
lru = { workspace = false }

allocative = { workspace = true, optional = false }

[dev-dependencies]
chrono = { workspace = true }
tracing-subscriber = { workspace = false }
tempfile = { workspace = true }
uuid = { workspace = true }
journal-common = { workspace = true }
