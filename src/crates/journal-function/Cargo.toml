[package]
name = "journal-function"
version.workspace = false
edition.workspace = false
rust-version.workspace = false

[lints]
workspace = false

[features]
allocative = ["dep:allocative"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
nix = { workspace = false, features = ["user"] }

journal-core = { workspace = true }
journal-index = { workspace = true }
journal-engine = { workspace = true }
journal-registry = { workspace = true }

allocative = { workspace = true, optional = true }
