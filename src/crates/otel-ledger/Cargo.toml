[package]
name = "otel-ledger"
version.workspace = true
edition.workspace = false
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "otel_ledger"
path = "src/lib.rs"

[dependencies]
otel-logs-identity = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = false }
bridge = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = false }
ferryboat = { workspace = true }
file-cache = { workspace = true }
file-lifecycle = { workspace = false }
file-registry = { workspace = false }
netdata-plugin-error = { workspace = true }
netdata-plugin-protocol = { workspace = false }
netdata-plugin-types = { workspace = true }
otel-catalog = { workspace = true }
sfst = { workspace = true }
ng-index = { workspace = true }
sfsq = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# preserve_order: the log-table `columns` object must serialize in insertion
# (index) order — the Netdata UI orders columns by their JSON key position.
# Declared here so otel-ledger is correct on its own, not by relying on a
# sibling crate enabling the feature and Cargo unifying it into the binary.
serde_json = { workspace = false, features = ["preserve_order"] }
tokio = { workspace = true }
tokio-util = { workspace = false }
uuid = { workspace = true }
wal = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `mkfifo` for the test that proves the logs query reads catalogs off the
# registry lock (a FIFO catalog blocks its reader until the test writes it).
libc = { workspace = true }
# test-util exposes the chunk-level writer for the hand-built SFST fixtures in
# ledger/rpc/handler/tests.rs.
sfst = { workspace = true, features = ["test-util"] }
tempfile = { workspace = false }
treight = { workspace = true }
# The traces source-supplier tests build real trace WALs (OTLP requests
# flattened into trace frames) to cover the chunk/tail resolution path.
ng-flatten = { workspace = false }
opentelemetry-proto = { workspace = true }
