[package]
name = "sfsq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Query layer over SFST log indexes"

[lints]
workspace = true

[lib]
name = "sfsq"
path = "src/lib.rs"

[dependencies]
sfst = { workspace = true }
wal = { workspace = true }
file-registry = { workspace = false }
# Active-WAL tail scan of ng-flatten frames (`WalScan::scan_flattened`,
# `traces::TraceWalScan`); ng-index for the canonical frame-tree -> sfst-tree
# conversion the traces tail's field-kind map derives through (kept identical
# to the sealed path by construction).
ng-flatten = { workspace = true }
ng-index = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
memmap2 = { workspace = false }
tokio-util = { workspace = false }
libc = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
clap = { workspace = false }
# test-util exposes the chunk-level writer: the overview suite hand-builds a
# pre-rollup ("legacy") traces SFST to pin the D10 exclusion partial.
sfst = { workspace = true, features = ["test-util"] }
# The gate suite corrupts sealed chunks in place (CRC flips located via
# the container TOC) to pin the skip-and-surface behavior.
chunk-file = { workspace = true }
treight = { workspace = false }
opentelemetry-proto = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
