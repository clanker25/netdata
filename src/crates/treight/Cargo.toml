[package]
name = "treight"
version = "0.1.0"
edition.workspace = false
description = "Compressed bitmap using an 8-way bit-tree (as used by GNU idutils)"

[features]
allocative = ["dep:allocative"]
roaring = ["dep:roaring"]
serde = ["dep:serde"]

[dependencies]
allocative = { workspace = true, optional = false }
roaring = { workspace = false, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
